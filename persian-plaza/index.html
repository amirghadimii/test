<style>
/* ============ Persian Plaza — quiet luxury design system ============ */
:root{
  --ivory:#faf8f3;
  --paper:#ffffff;
  --stone:#edeae7;
  --stone-deep:#d9d3ca;
  --ink:#1e1b16;
  --ink-2:#4c463e;
  --ink-3:#8a8378;
  --bronze:#a3804f;
  --bronze-deep:#8a6c3e;
  --line:#e4e0d7;
  --dark:#211e1a;
  --dark-2:#2b2721;
  --error:#a33327;
  --ok:#3e6b4f;
  --font:"Vazirmatn",Tahoma,system-ui,sans-serif;
  --latin:"Marcellus",serif;
  --shell:1240px;
  --ease:cubic-bezier(.22,.8,.28,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--ivory);
  color:var(--ink);
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
::selection{background:var(--bronze);color:#fff}
.shell{width:min(var(--shell),calc(100% - 3rem));margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-100px;inset-inline-start:1rem;z-index:200;background:var(--ink);color:#fff;padding:.6rem 1.2rem;border-radius:0 0 10px 10px;transition:top .25s}
.skip-link:focus{top:0}
:focus-visible{outline:2px solid var(--bronze);outline-offset:3px;border-radius:2px}

/* ---------- type helpers ---------- */
.eyebrow{display:flex;align-items:center;gap:.7rem;font-size:.8rem;font-weight:600;color:var(--bronze-deep)}
.eyebrow::before{content:"";width:2.2rem;height:1px;background:var(--bronze)}
.latin-label{font-family:var(--latin);letter-spacing:.42em;font-size:.72rem;text-transform:uppercase;color:var(--ink-3)}
.section-heading h2{font-size:clamp(1.85rem,3.6vw,2.9rem);font-weight:800;line-height:1.3;margin-top:.55rem}
.section-heading .section-description{color:var(--ink-2);max-width:56ch;margin-top:.7rem;font-size:1.02rem}
.section-heading--center{text-align:center}
.section-heading--center .section-description{margin-inline:auto}
.section-heading--center .eyebrow{justify-content:center}
.section-heading--center .eyebrow::after{content:"";width:2.2rem;height:1px;background:var(--bronze)}
section{padding:clamp(4.5rem,9vw,7.5rem) 0}
.fine-print{font-size:.82rem;color:var(--ink-3)}

/* ---------- buttons ---------- */
.button{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.85rem 1.9rem;border-radius:999px;
  font-size:.95rem;font-weight:600;line-height:1.4;
  transition:background .3s var(--ease),color .3s var(--ease),border-color .3s,transform .3s var(--ease);
  border:1px solid transparent;white-space:nowrap;
}
.button svg{flex:none}
.button--dark{background:var(--ink);color:#fff}
.button--dark:hover{background:var(--dark-2);transform:translateY(-1px)}
.button--bronze{background:var(--bronze);color:#fff}
.button--bronze:hover{background:var(--bronze-deep)}
.button--outline{border-color:var(--ink);color:var(--ink);background:transparent}
.button--outline:hover{background:var(--ink);color:#fff}
.button--light{border-color:rgba(255,255,255,.65);color:#fff;background:transparent}
.button--light:hover{background:#fff;color:var(--ink)}
.icon-button{
  display:inline-flex;align-items:center;justify-content:center;
  width:2.6rem;height:2.6rem;border-radius:50%;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  transition:border-color .25s,background .25s,color .25s;flex:none;
}
.icon-button:hover{border-color:var(--ink)}
.icon-button:disabled{opacity:.35;cursor:default}
.text-link{
  display:inline-flex;align-items:center;gap:.45rem;
  font-weight:600;font-size:.95rem;color:var(--ink);
  border-bottom:1px solid var(--bronze);padding-bottom:.15rem;
  transition:color .25s,border-color .25s;
}
.text-link:hover{color:var(--bronze-deep)}
.text-link svg{transition:transform .3s var(--ease)}
.text-link:hover svg{transform:translateX(-3px)}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:90;
  background:rgba(250,248,243,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;min-height:4.6rem}
.brand{display:flex;align-items:center;gap:.8rem}
.brand-mark{width:2.35rem;height:2.45rem;color:var(--ink)}
.brand-copy{display:flex;flex-direction:column;line-height:1.25}
.brand-copy strong{font-size:1.06rem;font-weight:800}
.brand-copy small{font-size:.72rem;color:var(--ink-3);font-weight:500}
.desktop-nav{display:flex;gap:2rem}
.desktop-nav a{font-size:.92rem;font-weight:500;color:var(--ink-2);padding:.4rem 0;position:relative;transition:color .25s}
.desktop-nav a::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:0;height:1px;background:var(--bronze);transition:width .35s var(--ease)}
.desktop-nav a:hover,.desktop-nav a[aria-current]{color:var(--ink)}
.desktop-nav a:hover::after,.desktop-nav a[aria-current]::after{width:100%}
.header-actions{display:flex;align-items:center;gap:1.1rem}
.header-phone{display:inline-flex;align-items:center;gap:.45rem;font-size:.9rem;font-weight:600;color:var(--ink-2)}
.header-phone:hover{color:var(--ink)}
.header-book{padding:.62rem 1.5rem}
.header-menu{display:none}
.mobile-nav{border-top:1px solid var(--line);background:var(--ivory)}
.mobile-links{display:flex;flex-direction:column;padding:.8rem 0 1.4rem}
.mobile-links a,.mobile-links .mobile-phone{
  display:flex;align-items:center;gap:.5rem;text-align:start;
  padding:.8rem 0;font-size:1rem;font-weight:600;border-bottom:1px solid var(--line);color:var(--ink);
}
.mobile-links>*:last-child{border-bottom:none}

/* ---------- hero (ref-1: type on ivory, photo below, bar overlaps) ---------- */
.hero{padding:0;background:var(--ivory)}
.hero-top{padding:clamp(3.2rem,7vw,5.6rem) 0 clamp(2.2rem,4vw,3.4rem)}
.hero-kicker{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap}
.stars{display:inline-flex;gap:.14rem;color:var(--bronze)}
.star-item{position:relative;display:inline-flex}
.star-item>span{position:absolute;top:0;inset-inline-start:0;overflow:hidden;display:inline-flex}
.hero h1{font-size:clamp(2.7rem,7.2vw,5.4rem);font-weight:900;line-height:1.22;margin-top:1.4rem;max-width:15ch}
.hero h1 .accent{color:var(--bronze)}
.hero-sub{display:flex;align-items:flex-end;justify-content:space-between;gap:2.5rem;flex-wrap:wrap;margin-top:1.6rem}
.hero-sub p{max-width:44ch;color:var(--ink-2);font-size:1.06rem}
.hero-cta{display:flex;align-items:center;gap:1.6rem;flex-wrap:wrap}
.hero-media{position:relative;overflow:hidden}
.hero-media img{width:100%;height:clamp(340px,58vh,560px);object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
.hero-bar-wrap{position:relative;z-index:5;margin-top:-3.4rem}
.booking-bar{
  background:var(--paper);
  box-shadow:0 24px 60px -24px rgba(30,27,22,.28),0 2px 8px rgba(30,27,22,.06);
  border:1px solid var(--line);border-radius:18px;
  display:flex;align-items:stretch;padding:.7rem;
}
.booking-bar .booking-field{flex:1}
.booking-bar .hero-reserve{border-radius:12px;margin-inline-start:.7rem;padding-inline:1.7rem}

/* ---------- booking fields / popovers ---------- */
.booking-field{position:relative}
.field-trigger{width:100%;display:flex;align-items:center;gap:.6rem;text-align:start;padding:.65rem .9rem;border-radius:12px;transition:background .25s}
.field-trigger:hover{background:var(--ivory)}
.field-icon{color:var(--bronze-deep);flex:none}
.field-text{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.field-label{font-size:.72rem;color:var(--ink-3);font-weight:500}
.field-value{font-size:.95rem;font-weight:700;white-space:nowrap}
.field-chevron{color:var(--ink-3);margin-inline-start:auto;flex:none}
.booking-bar .booking-field + .booking-field{border-inline-start:1px solid var(--line)}
.field-popover{
  position:absolute;top:calc(100% + .55rem);inset-inline-start:0;z-index:60;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 30px 60px -20px rgba(30,27,22,.35);
  padding:1.1rem;min-width:290px;animation:pop .22s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.calendar-head strong{font-size:.98rem;font-weight:800}
.calendar-arrow{width:2.1rem;height:2.1rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);transition:border-color .2s}
.calendar-arrow:hover:not(:disabled){border-color:var(--ink)}
.calendar-arrow:disabled{opacity:.3;cursor:default}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.18rem;text-align:center}
.calendar-weekday{font-size:.72rem;color:var(--ink-3);font-weight:600;padding:.3rem 0}
.calendar-day{aspect-ratio:1;border-radius:50%;font-size:.86rem;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.calendar-day:hover:not(:disabled){background:var(--stone)}
.calendar-day:disabled{color:#c9c3b8;cursor:default}
.calendar-day[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.guest-popover{min-width:250px}
.guest-popover p{font-size:.85rem;color:var(--ink-2);font-weight:600;margin-bottom:.7rem}
.guest-stepper{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.guest-stepper output{font-weight:800;font-size:1.02rem}
.guest-apply{width:100%}

/* ---------- availability ---------- */
.availability-section{padding:2.6rem 0 0}
.availability-card{background:var(--stone);border-radius:22px;padding:clamp(1.6rem,4vw,2.6rem)}
.availability-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.availability-head h2{font-size:1.7rem;font-weight:800;margin-top:.4rem}
.availability-head p{color:var(--ink-2);font-size:.94rem}
.availability-summary{margin-top:1rem;font-weight:600}
.availability-list{margin-top:1.2rem;display:flex;flex-direction:column}
.availability-item{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;padding:1.05rem 0;border-top:1px solid var(--stone-deep)}
.availability-item>div:first-child{display:flex;flex-direction:column;line-height:1.5}
.availability-item strong{font-size:1.05rem}
.availability-item small{color:var(--ink-2)}
.availability-item>div:nth-child(2){margin-inline-start:auto;font-weight:800;white-space:nowrap}
.availability-item>div:nth-child(2) small{font-weight:500}
.availability-error{margin-top:1rem;color:var(--error);font-weight:600}
.availability-empty{margin-top:1rem}
.availability-empty-actions{display:flex;gap:.8rem;margin-top:1.1rem;flex-wrap:wrap}

/* ---------- welcome ---------- */
.welcome-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(2.2rem,5vw,4.5rem);align-items:center}
.welcome-photo{overflow:hidden;border-radius:4px}
.welcome-photo img{width:100%;height:100%;min-height:380px;object-fit:cover;transition:transform 1.4s var(--ease)}
.welcome-photo:hover img{transform:scale(1.04)}
.welcome-copy>p{color:var(--ink-2);margin-top:1.1rem}
.hotel-stats{display:flex;gap:clamp(1.6rem,4vw,3.2rem);margin-top:2.2rem;padding-top:1.6rem;border-top:1px solid var(--line);flex-wrap:wrap}
.hotel-stats>div{display:flex;flex-direction:column}
.hotel-stats dd{font-size:1.9rem;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:.35rem;color:var(--ink)}
.hotel-stats dt{font-size:.83rem;color:var(--ink-3);font-weight:500}
.welcome-copy .text-link{margin-top:1.9rem}

/* ---------- rooms: editorial index ---------- */
.rooms-section{background:var(--paper)}
.room-filters{display:flex;gap:2rem;justify-content:center;margin-top:2rem;flex-wrap:wrap}
.room-filters button{font-size:.95rem;font-weight:600;color:var(--ink-3);padding:.35rem 0;position:relative;transition:color .25s}
.room-filters button::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:0;height:2px;background:var(--bronze);transition:width .3s var(--ease)}
.room-filters button[aria-pressed="true"]{color:var(--ink)}
.room-filters button[aria-pressed="true"]::after{width:100%}
.room-index{margin-top:clamp(2.6rem,5vw,4rem);display:flex;flex-direction:column}
.room-row{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center;padding:clamp(2.2rem,4vw,3.4rem) 0;border-top:1px solid var(--line)}
.room-row:first-child{border-top:none;padding-top:0}
.room-row:nth-child(even) .room-photo{order:2}
.room-photo{position:relative;overflow:hidden;border-radius:4px;margin:0}
.room-photo img{width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform 1.4s var(--ease)}
.room-row:hover .room-photo img{transform:scale(1.045)}
.room-photo figcaption{
  position:absolute;bottom:1rem;inset-inline-start:1rem;
  font-family:var(--latin);letter-spacing:.3em;font-size:.68rem;text-transform:uppercase;
  color:#fff;background:rgba(30,27,22,.55);padding:.4rem .8rem;border-radius:999px;
}
.room-info .room-no{font-family:var(--latin);font-size:.85rem;letter-spacing:.25em;color:var(--bronze-deep)}
.room-info h3{font-size:clamp(1.5rem,2.6vw,2.05rem);font-weight:800;margin-top:.5rem;line-height:1.35}
.room-info .room-description{color:var(--ink-2);margin-top:.8rem;max-width:42ch}
.room-specs{list-style:none;display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.9rem;color:var(--ink-2);font-weight:500}
.room-specs li{display:inline-flex;align-items:center;gap:.45rem}
.room-specs svg{color:var(--bronze-deep)}
.room-bottom{display:flex;align-items:center;gap:1.8rem;margin-top:1.6rem;flex-wrap:wrap}
.room-price{display:flex;flex-direction:column;line-height:1.35}
.room-price small{font-size:.75rem;color:var(--ink-3)}
.room-price strong{font-size:1.45rem;font-weight:800;white-space:nowrap}
.room-price strong small{font-size:.8rem;color:var(--ink-2);font-weight:500}
.rooms-note{margin-top:2.4rem;text-align:center}

/* ---------- direct booking ---------- */
.direct-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6rem 3rem;margin-top:clamp(2.6rem,5vw,3.6rem)}
.direct-item{border-top:1px solid var(--line);padding-top:1.5rem}
.direct-item svg{color:var(--bronze-deep)}
.direct-item h3{font-size:1.08rem;font-weight:700;margin-top:.9rem}
.direct-item p{color:var(--ink-2);font-size:.94rem;margin-top:.45rem}
.direct-cta{text-align:center;margin-top:3rem}

/* ---------- dining ---------- */
.dining-section{background:var(--paper)}
.dining-feature{display:grid;grid-template-columns:1fr 1.35fr;margin-top:clamp(2.6rem,5vw,4rem);border-radius:6px;overflow:hidden}
.dining-feature + .dining-feature{margin-top:2rem}
.dining-panel{background:var(--stone);padding:clamp(2rem,4.5vw,3.6rem);display:flex;flex-direction:column;justify-content:center;gap:1rem}
.dining-panel .editorial-index{font-family:var(--latin);letter-spacing:.25em;font-size:.8rem;color:var(--bronze-deep)}
.dining-panel h3{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;line-height:1.35}
.dining-panel p{color:var(--ink-2)}
.dining-panel .text-link{align-self:flex-start;margin-top:.4rem}
.dining-photo{overflow:hidden;min-height:320px}
.dining-photo img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.dining-feature:hover .dining-photo img{transform:scale(1.04)}
.dining-feature--cafe .dining-panel{order:2}

/* ---------- events ---------- */
.events{padding:0}
.events-band{position:relative;overflow:hidden}
.events-band img{width:100%;height:clamp(320px,52vh,480px);object-fit:cover}
.events-band::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(24,21,17,.62),rgba(24,21,17,.05) 55%)}
.events-band-copy{position:absolute;z-index:2;bottom:2.2rem;inset-inline:0;color:#fff}
.events-band-copy .latin-label{color:rgba(255,255,255,.75)}
.events-band-copy h2{font-size:clamp(2rem,5vw,3.4rem);font-weight:900;line-height:1.3;margin-top:.5rem}
.events-body{background:var(--dark);color:#f2efe8;padding:clamp(3rem,6vw,4.5rem) 0}
.events-body .section-description{color:#bdb5a6}
.events-body .eyebrow{color:#c9a76a}
.events-body .eyebrow::before{background:#c9a76a}
.events-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:2.5rem;align-items:start}
.events-list{display:flex;flex-direction:column;gap:1.6rem}
.events-list>div{display:flex;gap:1rem;align-items:flex-start}
.events-list svg{color:#c9a76a;flex:none;margin-top:.3rem}
.events-list h3{font-size:1.05rem;font-weight:700}
.events-list p{color:#bdb5a6;font-size:.92rem}

/* ---------- amenities ---------- */
.amenities-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(2.2rem,5vw,4.5rem);margin-top:clamp(2.6rem,5vw,4rem);align-items:start}
.amenities-photo{overflow:hidden;border-radius:4px;position:sticky;top:6.5rem}
.amenities-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform 1.4s var(--ease)}
.amenities-photo:hover img{transform:scale(1.04)}
.amenity-list{display:flex;flex-direction:column}
.amenity{display:flex;gap:1.3rem;padding:1.55rem 0;border-top:1px solid var(--line);align-items:flex-start}
.amenity:first-child{border-top:none;padding-top:.2rem}
.amenity svg{color:var(--bronze-deep);flex:none;margin-top:.25rem}
.amenity h3{font-size:1.1rem;font-weight:700}
.amenity p{color:var(--ink-2);font-size:.94rem;margin-top:.25rem}

/* ---------- gallery ---------- */
.gallery-section{background:var(--paper)}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6rem 1.4rem;margin-top:clamp(2.6rem,5vw,4rem)}
.gallery-tile{text-align:start;display:flex;flex-direction:column;gap:.7rem;padding:0}
.gallery-tile .tile-photo{overflow:hidden;border-radius:4px}
.gallery-tile img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform 1.2s var(--ease)}
.gallery-tile:hover img{transform:scale(1.05)}
.gallery-tile--wide{grid-column:span 2}
.gallery-tile--wide img{aspect-ratio:8/3.05}
.gallery-caption{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.98rem}
.gallery-caption svg{color:var(--bronze-deep);transition:transform .3s var(--ease)}
.gallery-tile:hover .gallery-caption svg{transform:translate(-2px,-2px)}

/* ---------- testimonials ---------- */
.review-stage{max-width:820px;margin:clamp(2.4rem,5vw,3.4rem) auto 0;text-align:center}
.review-slide blockquote{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:600;line-height:1.9;margin-top:1.4rem}
.review-slide figcaption{margin-top:1.6rem;display:flex;flex-direction:column;gap:.15rem;align-items:center}
.review-slide figcaption strong{font-size:1.02rem}
.review-slide figcaption a{font-size:.86rem;color:var(--ink-3);border-bottom:1px solid var(--line)}
.review-slide figcaption a:hover{color:var(--bronze-deep)}
.review-slide .stars{justify-content:center}
.review-nav{display:flex;align-items:center;justify-content:center;gap:1.4rem;margin-top:2.2rem}
.review-dots{display:flex;gap:.5rem}
.review-dots button{width:2rem;height:2rem;display:flex;align-items:center;justify-content:center}
.review-dots button span{width:.45rem;height:.45rem;border-radius:50%;background:var(--stone-deep);transition:background .3s,transform .3s}
.review-dots button[aria-pressed="true"] span{background:var(--bronze);transform:scale(1.25)}

/* ---------- offers ---------- */
.offers-section{background:var(--stone)}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:clamp(2.6rem,5vw,4rem)}
.offer-card{position:relative;text-align:start;border-radius:6px;overflow:hidden;color:#fff;min-height:420px;display:flex;align-items:flex-end;padding:0;width:100%}
.offer-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.offer-card:hover img{transform:scale(1.05)}
.offer-card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(24,21,17,.78),rgba(24,21,17,.08) 55%)}
.offer-card-body{position:relative;z-index:2;padding:2rem;width:100%}
.offer-badge{display:inline-block;background:var(--bronze);color:#fff;font-weight:800;font-size:.9rem;padding:.3rem .9rem;border-radius:999px;margin-bottom:.9rem}
.offer-card-body h3{font-size:1.6rem;font-weight:800}
.offer-card-body p{color:rgba(255,255,255,.85);font-size:.95rem;margin-top:.3rem;max-width:38ch}
.offer-card-body .offer-go{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.1rem;font-weight:700;font-size:.92rem;border-bottom:1px solid rgba(255,255,255,.7);padding-bottom:.2rem}
.offers-section .fine-print{margin-top:1.8rem}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2.2rem,5vw,4rem);margin-top:clamp(2.6rem,5vw,4rem);align-items:start}
.map-preview{position:relative;display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.map-drawing{width:100%;height:auto;display:block}
.map-pin{position:absolute;top:44%;inset-inline-start:52%;transform:translate(50%,-100%);color:var(--bronze-deep)}
.map-link{position:absolute;bottom:1rem;inset-inline-start:1rem;background:var(--ink);color:#fff;font-size:.85rem;font-weight:600;padding:.55rem 1.1rem;border-radius:999px;display:inline-flex;gap:.5rem;align-items:center}
.contact-details{font-style:normal;margin-top:1.6rem;display:flex;flex-direction:column}
.contact-details>div{display:flex;gap:.8rem;align-items:flex-start;padding:1rem 0;border-top:1px solid var(--line)}
.contact-details svg{color:var(--bronze-deep);flex:none;margin-top:.3rem}
.contact-details a:hover{color:var(--bronze-deep)}
.contact-form{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(1.6rem,3.5vw,2.4rem)}
.contact-form h3{font-size:1.3rem;font-weight:800;margin-bottom:1.4rem}
.input-label{display:flex;flex-direction:column;gap:.5rem;font-size:.88rem;font-weight:600;margin-bottom:1.1rem}
.input-label input,.input-label select,.input-label textarea{border:1px solid var(--line);border-radius:12px;background:var(--ivory);padding:.8rem 1rem;font-weight:500;transition:border-color .25s,background .25s;width:100%}
.input-label input:focus,.input-label select:focus,.input-label textarea:focus{outline:none;border-color:var(--bronze);background:var(--paper)}
.input-label textarea{resize:vertical}
.form-pair{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.form-status{font-size:.9rem;font-weight:600;color:var(--ok);margin-bottom:1rem}
.form-status--error{color:var(--error)}
.contact-draft{display:flex;flex-direction:column;gap:.9rem;align-items:flex-start}

/* ---------- footer ---------- */
.footer{background:var(--dark);color:#ece8df;padding:clamp(3.5rem,7vw,5rem) 0 0}
.footer .brand-mark{color:#ece8df}
.footer .brand-copy small{color:#9a927f}
.footer-top{display:grid;grid-template-columns:1.4fr .8fr .8fr 1.2fr;gap:2.6rem}
.footer-brand p{color:#b3ab99;font-size:.94rem;margin-top:1.1rem;max-width:30ch}
.social-links{display:flex;gap:.7rem;margin-top:1.4rem}
.footer .icon-button{background:transparent;border-color:#45403a;color:#ece8df}
.footer .icon-button:hover{border-color:#c9a76a;color:#c9a76a}
.footer-links{display:flex;flex-direction:column;gap:.65rem}
.footer-links h2,.newsletter h2{font-size:1rem;font-weight:700;margin-bottom:.7rem;color:#fff}
.footer-links a,.footer-links button{color:#b3ab99;font-size:.93rem;text-align:start;padding:0;transition:color .25s;width:fit-content}
.footer-links a:hover,.footer-links button:hover{color:#fff}
.newsletter p{color:#b3ab99;font-size:.92rem}
.newsletter-field{display:flex;gap:.6rem;margin-top:1.1rem}
.newsletter-field input{flex:1;min-width:0;background:var(--dark-2);border:1px solid #45403a;border-radius:999px;padding:.75rem 1.2rem;color:#fff}
.newsletter-field input::placeholder{color:#8d8672}
.newsletter-field input:focus{outline:none;border-color:#c9a76a}
.newsletter-field .button{border-radius:999px;padding:.75rem 1.1rem}
.newsletter-status{margin-top:.8rem;font-size:.86rem;color:#9fc7ab}
.newsletter-status.newsletter-error{color:#e5a49c}
.footer-bottom{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:1px solid #3a362f;margin-top:3rem;padding:1.4rem 0 1.6rem;font-size:.86rem;color:#9a927f}
.footer-bottom a:hover{color:#fff}

/* ---------- floating booking bar ---------- */
.float-bar{
  position:fixed;bottom:1rem;inset-inline:1rem;z-index:80;
  max-width:720px;margin-inline:auto;
  background:rgba(30,27,22,.94);color:#fff;
  border-radius:999px;padding:.55rem 1.4rem .55rem .55rem;
  display:flex;align-items:center;gap:1rem;
  box-shadow:0 20px 45px -12px rgba(30,27,22,.5);
  transform:translateY(160%);transition:transform .5s var(--ease);
}
.float-bar.visible{transform:none}
.float-bar .float-text{display:flex;flex-direction:column;line-height:1.4;margin-inline-end:auto}
.float-bar .float-text strong{font-size:.95rem}
.float-bar .float-text small{color:#b3ab99;font-size:.78rem}
.float-bar .button{padding:.65rem 1.5rem}

/* ---------- dialogs ---------- */
dialog.site-dialog{
  border:none;border-radius:22px;padding:0;background:var(--paper);color:var(--ink);
  width:min(680px,calc(100vw - 2rem));max-height:calc(100dvh - 2.5rem);
  overflow:auto;box-shadow:0 40px 90px -20px rgba(30,27,22,.45);margin:auto;
}
dialog.site-dialog::backdrop{background:rgba(28,25,20,.55)}
.dialog-close{
  position:absolute;top:1rem;inset-inline-end:1rem;z-index:5;
  width:2.5rem;height:2.5rem;border-radius:50%;background:var(--ivory);border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;transition:border-color .2s;
}
.dialog-close:hover{border-color:var(--ink)}
.dialog-body{padding:2.2rem clamp(1.4rem,4vw,2.4rem) 2.4rem}
.dialog-intro h2{font-size:1.75rem;font-weight:800;margin-top:.4rem}
.dialog-intro p{color:var(--ink-2);margin-top:.4rem;font-size:.95rem}
.booking-form{margin-top:1.4rem}
.dialog-stay{display:flex;flex-direction:column;background:var(--ivory);border:1px solid var(--line);border-radius:14px;padding:.4rem;margin-top:1.1rem}
.dialog-stay .booking-field + .booking-field{border-top:1px solid var(--line)}
.stay-times{font-size:.8rem;color:var(--ink-3);margin-top:.7rem}
.availability-chip{margin-top:1rem;font-size:.88rem;font-weight:600;border-radius:12px;padding:.75rem 1rem;background:#eef4ef;color:var(--ok);border:1px solid #d5e4d8}
.availability-chip--no{background:#f9efed;color:var(--error);border-color:#ecd3cf}
.booking-total{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.1rem 0;margin-top:1.3rem}
.booking-total>div{display:flex;flex-direction:column;line-height:1.45}
.booking-total span{font-weight:700}
.booking-total small{color:var(--ink-3);font-size:.82rem}
.booking-total strong{font-size:1.5rem;font-weight:800;white-space:nowrap}
.booking-total strong small{font-size:.85rem;color:var(--ink-2);font-weight:500}
.offer-note{margin-top:.9rem;font-size:.88rem;color:var(--bronze-deep);font-weight:600}
.booking-submit{width:100%;margin-top:1.3rem;padding:1rem}
.booking-note{font-size:.8rem;color:var(--ink-3);margin-top:1rem;text-align:center}
.booking-note a{border-bottom:1px solid var(--line);font-weight:600;color:var(--ink-2)}
.booking-complete{text-align:center}
.booking-complete>svg{color:var(--ok);margin-inline:auto}
.booking-complete h2{font-size:1.7rem;font-weight:800;margin-top:1rem}
.booking-complete>p{color:var(--ink-2);margin-top:.5rem}
.draft-code{display:inline-flex;flex-direction:column;gap:.1rem;margin-top:1.6rem;background:var(--stone);border-radius:14px;padding:1rem 2.2rem}
.draft-code span{font-size:.78rem;color:var(--ink-2);font-weight:600}
.draft-code bdi{font-family:var(--latin);font-size:1.5rem;letter-spacing:.14em;direction:ltr}
.confirmation-details{margin-top:1.4rem;display:flex;flex-direction:column;gap:.3rem;color:var(--ink-2)}
.confirmation-details strong{color:var(--ink);font-size:1.3rem;margin-top:.4rem}
.confirmation-actions{display:flex;gap:.8rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap}
.booking-complete .text-link{margin-top:1.4rem}
.tracking-form{margin-top:1.5rem}
.tracking-form .button{width:100%}
.tracking-result{margin-top:1.6rem;background:var(--stone);border-radius:16px;padding:1.4rem;text-align:center;display:flex;flex-direction:column;gap:.25rem}
.tracking-result h3{font-family:var(--latin);letter-spacing:.14em;direction:ltr;font-size:1.25rem}
.tracking-result p{color:var(--ink-2);font-size:.94rem}
.tracking-result strong{font-size:1.25rem;margin-top:.4rem}
.tracking-result small{color:var(--ink-3)}

/* ---------- lightbox ---------- */
dialog.lightbox{width:min(920px,calc(100vw - 2rem));background:var(--dark);color:#fff}
.lightbox-content{padding:1.2rem;margin:0}
.lightbox-frame{border-radius:10px;overflow:hidden}
.lightbox-frame img{width:100%;max-height:66dvh;object-fit:cover}
.lightbox-content figcaption{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem .3rem .3rem}
.lightbox-content figcaption h2{font-size:1.25rem;font-weight:700}
.lightbox-content figcaption p{color:#b3ab99;font-size:.85rem}
.slider-buttons{display:flex;gap:.6rem}
dialog.lightbox .icon-button{background:transparent;border-color:#45403a;color:#fff}
dialog.lightbox .dialog-close{background:var(--dark-2);border-color:#45403a;color:#fff}

/* ---------- reveal motion ---------- */
.reveal-section [data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal-section.has-entered [data-reveal]{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
  html{scroll-behavior:auto}
  .reveal-section [data-reveal]{opacity:1;transform:none}
}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .desktop-nav{display:none}
  .header-menu{display:inline-flex}
  .direct-grid{grid-template-columns:repeat(2,1fr)}
  .footer-top{grid-template-columns:1fr 1fr}
  .events-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .welcome-grid,.amenities-grid,.contact-grid{grid-template-columns:1fr}
  .amenities-photo{position:static}
  .amenities-photo img{aspect-ratio:16/10}
  .room-row{grid-template-columns:1fr;gap:1.6rem}
  .room-row:nth-child(even) .room-photo{order:0}
  .dining-feature{grid-template-columns:1fr}
  .dining-photo{min-height:240px;order:-1}
  .dining-feature--cafe .dining-panel{order:0}
  .gallery-grid{grid-template-columns:repeat(2,1fr)}
  .offer-grid{grid-template-columns:1fr}
  .offer-card{min-height:340px}
  .booking-bar{flex-wrap:wrap}
  .booking-bar .booking-field{flex:1 1 40%}
  .booking-bar .booking-field + .booking-field{border-inline-start:none}
  .booking-bar .hero-reserve{flex:1 1 100%;margin-inline-start:0;margin-top:.5rem;padding:1rem}
  .hero-bar-wrap{margin-top:-2.4rem}
  .header-phone{display:none}
}
@media (max-width:560px){
  body{font-size:15px}
  .shell{width:calc(100% - 2rem)}
  .direct-grid{grid-template-columns:1fr}
  .footer-top{grid-template-columns:1fr}
  .events-grid{grid-template-columns:1fr}
  .form-pair{grid-template-columns:1fr}
  .gallery-grid{grid-template-columns:1fr 1fr;gap:1.1rem .9rem}
  .hotel-stats{gap:1.4rem}
  .hero h1{font-size:2.55rem}
  .float-bar .float-text small{display:none}
  .booking-bar .booking-field{flex:1 1 100%}
  .field-popover{min-width:min(290px,calc(100vw - 3rem))}
  .header-book{padding:.55rem 1.1rem;font-size:.88rem}
  .brand-copy small{display:none}
}
</style>

const parts = (f,d)=>Object.fromEntries(f.formatToParts(d).map(({type,value})=>[type,value]));
const addDays = (v,n)=>new Date(dObj(v).getTime()+n*DAY).toISOString().slice(0,10);
const nightsBetween = (a,b)=>(a&&b)?Math.max(0,Math.round((dObj(b)-dObj(a))/DAY)):0;

function todayInTehran(){ const {year,month,day}=parts(tehranFmt,new Date()); return year+"-"+month+"-"+day; }
function persianMonth(value){
  const {day,month}=parts(persianPartsFmt,dObj(value));
  const first=addDays(value,1-Number(day));
  let length=29;
  while(parts(persianPartsFmt,dObj(addDays(first,length))).month===month) length++;
  return {first,offset:(dObj(first).getUTCDay()+1)%7,length,next:addDays(first,length),previous:addDays(first,-1)};
}
const normalizeDigits = (v)=>String(v).replace(/[۰-۹٠-٩]/g,(d)=>String(d.charCodeAt(0)&15));

/* ================= storage + booking engine (ported) ================= */
const KEYS = {reservations:"plaza:reservations",messages:"plaza:messages",subscribers:"plaza:subscribers"};
const STOCK = {double:6,twin:4,junior:3,royal:2,connect:2,president:1};
function readStore(key,fallback){ try{ const raw=localStorage.getItem(key); if(!raw) return fallback; const p=JSON.parse(raw); return Array.isArray(p)?p:fallback; }catch{ return fallback; } }
function writeStore(key,value){ try{ localStorage.setItem(key,JSON.stringify(value)); return true; }catch{ return false; } }
const getReservations = ()=>readStore(KEYS.reservations,[]);
const getMessages = ()=>readStore(KEYS.messages,[]);
const getSubscribers = ()=>readStore(KEYS.subscribers,[]);
function datesBetween(a,b){ const out=[]; for(let d=a;d<b;d=addDays(d,1)) out.push(d); return out; }
function isBlocked(roomId,date){
  const day=Number(date.slice(-2));
  if(roomId==="president") return day%17===0;
  if(roomId==="royal") return day%13===0;
  if(roomId==="connect") return day%11===0;
  if(roomId==="junior") return day%29===0;
  return false;
}
const overlaps = (a,b)=>a.checkIn<b.checkOut && b.checkIn<a.checkOut;
function createTrackingCode(existing){
  const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const used=new Set(existing.map((r)=>r.code));
  let code="";
  do{ const bytes=new Uint8Array(6); crypto.getRandomValues(bytes);
      code="PP-"+Array.from(bytes,(b)=>alphabet[b%alphabet.length]).join(""); }while(used.has(code));
  return code;
}
function saveReservation(input){
  const existing=getReservations();
  const reservation={...input,code:createTrackingCode(existing),createdAt:new Date().toISOString(),status:"در انتظار تأیید پذیرش"};
  writeStore(KEYS.reservations,[reservation,...existing]);
  return reservation;
}
function findReservation(code){
  const normalized=normalizeDigits(code).replace(/[\s-]/g,"").toUpperCase();
  return getReservations().find((r)=>r.code.replace(/-/g,"")===normalized)||null;
}
function calculateQuote(room,stay,offer){
  const nights=datesBetween(stay.checkIn,stay.checkOut).length;
  const subtotal=nights*room.price;
  const applies=Boolean(offer && nights>=offer.minimum && (!offer.room || offer.room===room.id));
  const discount=applies?Math.round(subtotal*offer.discount/100):0;
  return {nights,subtotal,discount,total:subtotal-discount,offerApplied:applies};
}
function checkAvailability(stay,roomId){
  const reservations=getReservations();
  const nights=datesBetween(stay.checkIn,stay.checkOut);
  const candidates=roomId?rooms.filter((r)=>r.id===roomId):rooms;
  return candidates.map((room)=>{
    let remaining=STOCK[room.id]||1, reason="";
    if(stay.guests>room.guests){ remaining=0; reason="گنجایش "+room.name+" "+fa.format(room.guests)+" نفر است"; }
    else{
      for(const r of reservations){ if(r.roomId===room.id && overlaps(stay,r)) remaining--; }
      const blocked=nights.filter((d)=>isBlocked(room.id,d));
      if(blocked.length){ remaining=0; reason="تاریخ "+shortFmt.format(dObj(blocked[0]))+" در تقویم این اقامتگاه بسته است"; }
      if(remaining<0) remaining=0;
      if(!reason && remaining===0) reason="تمام اتاق‌های این نوع در تاریخ انتخابی رزرو شده است";
    }
    return {roomId:room.id,roomName:room.name,available:remaining>0,remaining,reason,guests:room.guests};
  });
}
function saveContactMessage(input){
  const message={...input,id:"MSG-"+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString()};
  writeStore(KEYS.messages,[message,...getMessages()]);
  return message;
}
function subscribeToNewsletter(email){
  const normalized=email.trim().toLowerCase();
  const subs=getSubscribers();
  if(subs.some((s)=>s.email===normalized)) return {ok:false,message:"این نشانی قبل از این در خبرنامه ثبت شده است."};
  const ok=writeStore(KEYS.subscribers,[{email:normalized,createdAt:new Date().toISOString()},...subs]);
  return {ok,message:ok?"عضویت شما با موفقیت ثبت شد.":"امکان ذخیره در این مرورگر وجود ندارد."};
}
const contactValueIsValid = (v)=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) || /^09\d{9}$/.test(normalizePhone(v));
function stayWithArrival(stay,checkIn){
  return {...stay,checkIn,checkOut:(stay.checkOut && stay.checkOut<=checkIn)?addDays(checkIn,1):stay.checkOut};
}

  const {label,onChange}=opts;
  let {min,max}=opts;
  const wrap = el('<div class="booking-field booking-field--date"></div>');
  let current = opts.value||"";
  let reference = current||min;
  function render(){
    wrap.innerHTML =
      '<button type="button" class="field-trigger" aria-haspopup="dialog" aria-expanded="false">'
      +'<span class="field-icon">'+I.calendar+'</span>'
      +'<span class="field-text"><span class="field-label">'+esc(label)+'</span>'
      +'<span class="field-value">'+(current?esc(dateLabel(current)):"انتخاب تاریخ")+'</span></span>'
      +'<span class="field-chevron">'+I.chevD+'</span></button>';
    const trigger = wrap.querySelector(".field-trigger");
    trigger.addEventListener("click",()=>{
      const wasOpen = !!wrap.querySelector(".field-popover");
      closeAllPopovers();
      if(!wasOpen) openCalendar(trigger);
    });
  }
  function openCalendar(trigger){
    reference = (current && current>=min && current<=max) ? current : min;
    const pop = el('<div class="field-popover calendar" role="dialog" aria-label="تقویم شمسی '+esc(label)+'"></div>');
    wrap.appendChild(pop);
    trigger.setAttribute("aria-expanded","true");
    function draw(){
      const m = persianMonth(reference);
      const allowed = (d)=>d>=min && d<=max;
      let days="";
      const shortWd=["ش","ی","د","س","چ","پ","ج"];
      const fullWd=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
      shortWd.forEach((w,i)=>{ days+='<span class="calendar-weekday" title="'+fullWd[i]+'">'+w+'</span>'; });
      for(let i=0;i<m.offset;i++) days+='<span aria-hidden="true"></span>';
      for(let i=0;i<m.length;i++){
        const d=addDays(m.first,i);
        days+='<button type="button" class="calendar-day" data-date="'+d+'" aria-label="'+esc(dateLabel(d,true))+'" aria-pressed="'+(d===current)+'"'+(allowed(d)?"":" disabled")+'>'+fa.format(i+1)+'</button>';
      }
      pop.innerHTML =
        '<div class="calendar-head">'
        +'<button type="button" class="calendar-arrow" data-nav="prev" aria-label="ماه قبل"'+(m.previous<min?" disabled":"")+'>'+I.chevR+'</button>'
        +'<strong aria-live="polite">'+esc(monthLabel(reference))+'</strong>'
        +'<button type="button" class="calendar-arrow" data-nav="next" aria-label="ماه بعد"'+(m.next>max?" disabled":"")+'>'+I.chevL+'</button>'
        +'</div><div class="calendar-grid">'+days+'</div>';
      pop.querySelector('[data-nav="prev"]').addEventListener("click",()=>{ reference=m.previous; draw(); });
      pop.querySelector('[data-nav="next"]').addEventListener("click",()=>{ reference=m.next; draw(); });
      pop.querySelectorAll(".calendar-day").forEach((btn)=>{
        btn.addEventListener("click",()=>{ current=btn.dataset.date; cleanup(); render(); onChange(current); });
        btn.addEventListener("keydown",(ev)=>{
          const step={ArrowLeft:1,ArrowRight:-1,ArrowUp:-7,ArrowDown:7}[ev.key];
          if(step==null) return;
          ev.preventDefault();
          const target=addDays(btn.dataset.date,step);
          if(target<min||target>max) return;
          reference=target; draw();
          pop.querySelector('[data-date="'+target+'"]')?.focus();
        });
      });
    }
    draw();
    const focusDate = (current && current>=min && current<=max)?current:min;
    pop.querySelector('[data-date="'+focusDate+'"]')?.focus({preventScroll:true});
    function onDoc(ev){ if(!wrap.contains(ev.target)) cleanup(); }
    function onKey(ev){ if(ev.key==="Escape"){ ev.stopPropagation(); cleanup(); trigger.focus(); } }
    function cleanup(){
      document.removeEventListener("pointerdown",onDoc);
      document.removeEventListener("focusin",onDoc);
      document.removeEventListener("keydown",onKey,true);
      pop.remove(); trigger.setAttribute("aria-expanded","false");
      if(openPopoverCleanup===cleanup) openPopoverCleanup=null;
    }
    document.addEventListener("pointerdown",onDoc);
    document.addEventListener("focusin",onDoc);
    document.addEventListener("keydown",onKey,true);
    openPopoverCleanup=cleanup;
  }
  render();
  return { element:wrap, setValue(v){ current=v||""; render(); }, getValue:()=>current,
    setMin(v){ min=v; }, setMax(v){ max=v; } };
}
function makeGuestField({guests,max,onChange}){
  const wrap = el('<div class="booking-field booking-field--guests"></div>');
  let current = guests;
  function render(){
    wrap.innerHTML =
      '<button type="button" class="field-trigger" aria-haspopup="dialog" aria-expanded="false">'
      +'<span class="field-icon">'+I.users+'</span>'
      +'<span class="field-text"><span class="field-label">مهمانان</span>'
      +'<span class="field-value">'+fa.format(current)+' نفر</span></span>'
      +'<span class="field-chevron">'+I.chevD+'</span></button>';
    const trigger=wrap.querySelector(".field-trigger");
    trigger.addEventListener("click",()=>{
      const wasOpen=!!wrap.querySelector(".field-popover");
      closeAllPopovers();
      if(!wasOpen) openPop(trigger);
    });
  }
  function openPop(trigger){
    const pop=el('<div class="field-popover guest-popover" role="dialog" aria-label="انتخاب تعداد مهمانان"></div>');
    wrap.appendChild(pop);
    trigger.setAttribute("aria-expanded","true");
    function draw(){
      pop.innerHTML='<p>تعداد مهمانان</p><div class="guest-stepper">'
        +'<button type="button" class="icon-button" data-step="-1" aria-label="کاهش تعداد مهمانان"'+(current<=1?" disabled":"")+'>'+I.minus+'</button>'
        +'<output aria-live="polite">'+fa.format(current)+' نفر</output>'
        +'<button type="button" class="icon-button" data-step="1" aria-label="افزایش تعداد مهمانان"'+(current>=max?" disabled":"")+'>'+I.plus+'</button>'
        +'</div><button type="button" class="button button--dark guest-apply">تأیید '+I.check+'</button>';
      pop.querySelectorAll("[data-step]").forEach((b)=>b.addEventListener("click",()=>{
        current=Math.max(1,Math.min(max,current+Number(b.dataset.step))); draw(); renderValueOnly();
      }));
      pop.querySelector(".guest-apply").addEventListener("click",()=>{ cleanup(); trigger.focus(); });
    }
    function renderValueOnly(){ wrap.querySelector(".field-value").textContent=fa.format(current)+" نفر"; }
    draw();
    function onDoc(ev){ if(!wrap.contains(ev.target)) cleanup(); }
    function onKey(ev){ if(ev.key==="Escape"){ ev.stopPropagation(); cleanup(); trigger.focus(); } }
    function cleanup(){
      document.removeEventListener("pointerdown",onDoc);
      document.removeEventListener("focusin",onDoc);
      document.removeEventListener("keydown",onKey,true);
      pop.remove(); trigger.setAttribute("aria-expanded","false");
      if(openPopoverCleanup===cleanup) openPopoverCleanup=null;
      onChange(current);
    }
    document.addEventListener("pointerdown",onDoc);
    document.addEventListener("focusin",onDoc);
    document.addEventListener("keydown",onKey,true);
    openPopoverCleanup=cleanup;
  }
  render();
  return { element:wrap, setValue(v){ current=v; render(); }, getValue:()=>current, setMax(m){ max=m; if(current>m){ current=m; render(); } } };
}

/* ================= dialog helper ================= */
function openDialog(build,{className="",labelledBy}={}){
  const dlg=document.createElement("dialog");
  dlg.className="site-dialog "+className;
  if(labelledBy) dlg.setAttribute("aria-labelledby",labelledBy);
  const closeBtn=el('<button type="button" class="dialog-close" aria-label="بستن">'+I.x+'</button>');
  const body=el('<div class="dialog-body"></div>');
  dlg.appendChild(closeBtn); dlg.appendChild(body);
  document.body.appendChild(dlg);
  const prevFocus=document.activeElement;
  const prevOverflow=document.body.style.overflow;
  function close(){
    if(dlg.open) dlg.close();
    dlg.remove();
    document.body.style.overflow=prevOverflow;
    if(prevFocus && prevFocus.isConnected) prevFocus.focus({preventScroll:true});
    document.querySelector(".float-bar")?.classList.toggle("visible",window.scrollY>620);
  }
  closeBtn.addEventListener("click",close);
  dlg.addEventListener("cancel",(ev)=>{ ev.preventDefault(); close(); });
  dlg.addEventListener("click",(ev)=>{
    if(ev.target!==dlg) return;
    const r=dlg.getBoundingClientRect();
    if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom) close();
  });
  build(body,close);
  dlg.showModal();
  document.body.style.overflow="hidden";
  document.querySelector(".float-bar")?.classList.remove("visible");
  return {dialog:dlg,close,body};
}

    if(!panel.hidden && !header.contains(ev.target)) setExpanded(false);
  });
  document.addEventListener("keydown",(ev)=>{
    if(ev.key==="Escape" && !panel.hidden){ setExpanded(false); toggle.focus(); }
  });
  /* scrollspy */
  const links=header.querySelectorAll("[data-nav]");
  function spy(){
    let current="home";
    for(const n of navigation){
      const s=document.getElementById(n.id);
      if(s && s.getBoundingClientRect().top<=160) current=n.id;
    }
    links.forEach((a)=>{ if(a.dataset.nav===current) a.setAttribute("aria-current","location"); else a.removeAttribute("aria-current"); });
  }
  window.addEventListener("scroll",spy,{passive:true});
  window.addEventListener("resize",spy,{passive:true});
  return header;
}

function renderAvailability(){

            +'<button type="button" class="button button--dark" data-book-room="'+r.roomId+'">رزرو</button></article>';
        }).join("")

  document.getElementById("home").after(sec);
}

function openLightbox(index){
  let current=index;
  let moveFn=null;
  const {body,dialog} = openDialog((body)=>{
    function move(by){ current=(current+by+galleryItems.length)%galleryItems.length; draw(); }
    moveFn=move;
    function draw(){
      const photo=galleryItems[current];
      body.innerHTML='<figure class="lightbox-content"><div class="lightbox-frame"><img src="'+img(photo.photo)+'" alt="'+esc(photo.alt)+'" /></div>'
        +'<figcaption><div><h2>'+esc(photo.title)+'</h2><p>'+fa.format(current+1)+' از '+fa.format(galleryItems.length)+' تصویر</p></div>'
        +'<div class="slider-buttons"><button class="icon-button" type="button" data-prev aria-label="تصویر قبلی">'+I.chevR+'</button>'
        +'<button class="icon-button" type="button" data-next aria-label="تصویر بعدی">'+I.chevL+'</button></div></figcaption></figure>';
      body.querySelector("[data-prev]").addEventListener("click",()=>move(-1));
      body.querySelector("[data-next]").addEventListener("click",()=>move(1));
    }
    draw();
  },{className:"lightbox"});
  dialog.addEventListener("keydown",(ev)=>{
    if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){
      ev.preventDefault();
      if(moveFn) moveFn(ev.key==="ArrowLeft"?1:-1);
    }
  });
}

<script>

/* ================= booking dialog ================= */
function openBooking(seed){
  seed = seed||{};
  const today=todayInTehran();
  const maxDate=addDays(today,365);
  const offer=seed.offer||null;
  const initial=rooms.find((r)=>r.id===(seed.roomId||(offer&&offer.room)))
    || rooms.find((r)=>r.guests>=(seed.guests||2)) || rooms[0];
  let roomId=initial.id;
  const checkIn0=(seed.checkIn && seed.checkIn>=today && seed.checkIn<maxDate)?seed.checkIn:today;
  const suggested=addDays(checkIn0,(offer?offer.minimum:0)||1);
  const checkOut0=(seed.checkOut && seed.checkOut>checkIn0 && seed.checkOut<=maxDate)?seed.checkOut:(suggested<=maxDate?suggested:maxDate);
  const stay={checkIn:checkIn0,checkOut:checkOut0,guests:Math.min(seed.guests||2,initial.guests)};
  const headingId="booking-title-"+Math.random().toString(36).slice(2,8);

  const {body,close}=openDialog((body,close)=>{
    body.innerHTML =
      '<div class="dialog-intro"><p class="eyebrow">اقامت در پرشین پلازا</p>'
      +'<h2 id="'+headingId+'">رزرو اقامت</h2>'
      +'<p>تاریخ شمسی، اتاق و تعداد مهمانان خود را مشخص کنید و رزروتان را ثبت نمایید.</p></div>'
      +'<form class="booking-form" novalidate>'
      +'<label class="input-label">اتاق یا سوئیت<select name="room">'
      + rooms.map((r)=>'<option value="'+r.id+'">'+esc(r.name)+' ('+fa.format(r.guests)+' نفر)</option>').join("")
      +'</select></label>'
      +'<div class="dialog-stay"></div>'
      +'<p class="stay-times">ورود ۱۴:۰۰ · خروج ۱۲:۰۰ — تمام تاریخ‌ها بر اساس تقویم شمسی</p>'
      +'<div class="availability-chip" role="status"></div>'
      +'<div class="form-pair" style="margin-top:1.1rem">'
      +'<label class="input-label">نام و نام خانوادگی<input name="guestName" autocomplete="name" placeholder="نام کامل مهمان" maxlength="80" required /></label>'
      +'<label class="input-label">شماره موبایل<input name="guestPhone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="۰۹۱۲۱۲۳۴۵۶۷" maxlength="14" required /></label>'
      +'</div>'
      +'<div class="booking-total" aria-live="polite"></div>'
      + (offer?'<p class="offer-note"></p>':"")
      +'<div class="form-feedback"></div>'
      +'<button class="button button--bronze booking-submit" type="submit">ثبت رزرو و دریافت کد رهگیری '+I.arrowL+'</button>'
      +'<p class="booking-note">رزرو در این مرورگر ذخیره می‌شود و توسط پذیرش بررسی خواهد شد. برای استعلام آنلاین می‌توانید به <a href="'+hotel.bookingUrl+'" target="_blank" rel="noreferrer">سامانه رزرو هتل</a> مراجعه کنید.</p>'
      +'</form>';
    const form=body.querySelector(".booking-form");
    const roomSelect=form.querySelector('[name="room"]');
    roomSelect.value=roomId;
    const stayBox=form.querySelector(".dialog-stay");
    const inField=makeDateField({label:"ورود",value:stay.checkIn,min:today,max:addDays(maxDate,-1),
      onChange:(d)=>{ Object.assign(stay,stayWithArrival(stay,d)); outField.setMin(addDays(stay.checkIn,1)); outField.setValue(stay.checkOut); refresh(); }});
    const outField=makeDateField({label:"خروج",value:stay.checkOut,min:addDays(stay.checkIn,1),max:maxDate,
      onChange:(d)=>{ stay.checkOut=d; refresh(); }});
    const guestField=makeGuestField({guests:stay.guests,max:initial.guests,
      onChange:(g)=>{ stay.guests=g; refresh(); }});
    stayBox.append(inField.element,outField.element,guestField.element);
    const chip=form.querySelector(".availability-chip");
    const totalBox=form.querySelector(".booking-total");
    const offerNote=form.querySelector(".offer-note");
    const feedback=form.querySelector(".form-feedback");
    function currentRoom(){ return rooms.find((r)=>r.id===roomId)||initial; }
    function refresh(){
      const room=currentRoom();
      const quote=calculateQuote(room,stay,offer);
      const availability=checkAvailability(stay,roomId)[0];
      if(availability && availability.available){
        chip.className="availability-chip";
        chip.textContent="موجود است · "+fa.format(availability.remaining)+" واحد قابل رزرو";
      } else {
        chip.className="availability-chip availability-chip--no";
        chip.textContent="غیرقابل رزرو · "+(availability?availability.reason:"");
      }
      totalBox.innerHTML='<div><span>مبلغ برآوردی</span><small>'+fa.format(quote.nights)+' شب × '+fa.format(room.price)+' تومان</small></div>'
        +'<strong>'+fa.format(quote.total)+' <small>تومان</small></strong>';
      if(offerNote){
        offerNote.textContent=quote.discount
          ? fa.format(quote.discount)+' تومان تخفیف «'+offer.title+'» اعمال شد.'
          : "شرط اعمال پیشنهاد: "+offer.description+".";
      }
      return quote;
    }
    roomSelect.addEventListener("change",()=>{
      const next=rooms.find((r)=>r.id===roomSelect.value);
      if(!next) return;
      roomId=next.id;
      stay.guests=Math.min(stay.guests,next.guests);
      guestField.setMax(next.guests);
      guestField.setValue(stay.guests);
      refresh();
    });
    form.addEventListener("submit",(ev)=>{
      ev.preventDefault();
      const fail=(msg)=>{ feedback.innerHTML='<p class="form-status form-status--error" role="alert">'+msg+'</p>'; };
      const room=currentRoom();
      const quote=calculateQuote(room,stay,offer);
      if(!quote.nights || stay.checkIn<today || stay.checkOut>maxDate) return fail("لطفاً تاریخ ورود و خروج شمسی را دوباره بررسی کنید.");
      const name=form.querySelector('[name="guestName"]').value.trim();
      if(name.length<2) return fail("لطفاً نام و نام خانوادگی خود را وارد کنید.");
      const phone=form.querySelector('[name="guestPhone"]').value;
      if(!phoneIsValid(phone)) return fail("شماره موبایل معتبر نیست. لطفاً شماره‌ای مانند ۰۹۱۲۱۲۳۴۵۶۷ وارد کنید.");
      const current=checkAvailability(stay,roomId)[0];
      if(!current || !current.available) return fail("امکان رزرو "+room.name+" در این تاریخ وجود ندارد: "+(current?current.reason:"اتاق پر است")+".");
      const reservation=saveReservation({
        roomId:room.id, roomName:room.name,
        checkIn:stay.checkIn, checkOut:stay.checkOut,
        nights:quote.nights, guests:stay.guests,
        name, phone:normalizePhone(phone),
        pricePerNight:room.price, subtotal:quote.subtotal,
        discount:quote.discount, total:quote.total,
        offerId:offer?offer.id:undefined,
        offerTitle:(offer && quote.discount)?offer.title:undefined
      });
      showConfirmation(body,close,reservation,headingId);
    });
    refresh();
  },{labelledBy:headingId});
}
function showConfirmation(body,close,reservation,headingId){
  const emailBody=[
    "کد رهگیری: "+reservation.code,
    "نام مهمان: "+reservation.name,
    "شماره موبایل: "+reservation.phone,
    "اقامت: "+reservation.roomName+" برای "+fa.format(reservation.guests)+" نفر",
    "ورود: "+dateLabel(reservation.checkIn,true)+" ساعت ۱۴:۰۰",
    "خروج: "+dateLabel(reservation.checkOut,true)+" ساعت ۱۲:۰۰",
    "مبلغ برآوردی: "+fa.format(reservation.total)+" تومان"
  ].join("\n");
  body.innerHTML='<div class="booking-complete">'+I.circleCheck
    +'<h2 id="'+headingId+'" tabindex="-1">رزرو شما ثبت شد</h2>'
    +'<p>اطلاعات اقامت ذخیره شد. کد رهگیری را نگه دارید تا در هر زمان جزئیات رزرو را پیگیری کنید.</p>'
    +'<div class="draft-code"><span>کد رهگیری</span><bdi>'+reservation.code+'</bdi></div>'
    +'<div class="confirmation-details"><p>'+esc(reservation.roomName)+' · '+fa.format(reservation.nights)+' شب · '+fa.format(reservation.guests)+' نفر</p>'
    +'<p>ورود '+esc(dateLabel(reservation.checkIn))+' ساعت ۱۴:۰۰ — خروج '+esc(dateLabel(reservation.checkOut))+' ساعت ۱۲:۰۰</p>'
    +'<strong>'+fa.format(reservation.total)+' تومان</strong></div>'
    +'<div class="confirmation-actions"><button class="button button--dark" type="button" data-track>پیگیری رزرو</button>'
    +'<a class="button button--outline" href="'+esc(mailLink("جزئیات رزرو پرشین پلازا",emailBody))+'">'+I.mail+' ارسال جزئیات به ایمیل</a></div>'
    +'<button class="text-link" type="button" data-again>رزرو دیگری ثبت کنید</button></div>';
  body.querySelector("h2").focus();
  body.querySelector("[data-track]").addEventListener("click",()=>{ close(); openTracking(reservation.code); });
  body.querySelector("[data-again]").addEventListener("click",()=>{ close(); openBooking({...state.stay}); });
}

/* ================= tracking dialog ================= */
function openTracking(initialCode){
  const headingId="tracking-title-"+Math.random().toString(36).slice(2,8);
  openDialog((body)=>{
    body.innerHTML='<div class="dialog-intro"><p class="eyebrow">پیگیری اقامت</p>'
      +'<h2 id="'+headingId+'">پیگیری رزرو</h2>'
      +'<p>کد رهگیری PP که هنگام ثبت رزرو دریافت کرده اید وارد کنید.</p></div>'
      +'<form class="tracking-form" novalidate>'
      +'<label class="input-label">کد رهگیری<input name="code" placeholder="PP-XXXXXX" dir="ltr" maxlength="12" required /></label>'
      +'<div class="form-feedback"></div>'
      +'<button class="button button--bronze" type="submit">نمایش جزئیات رزرو</button></form>'
      +'<div class="tracking-slot"></div>';
    const form=body.querySelector(".tracking-form");
    const input=form.querySelector('[name="code"]');
    const feedback=body.querySelector(".form-feedback");
    const slot=body.querySelector(".tracking-slot");
    input.value=initialCode||"";
    function showResult(result){
      slot.innerHTML='<div class="tracking-result" role="status"><h3>'+esc(result.code)+'</h3>'
        +'<p>'+esc(result.roomName)+' · '+fa.format(result.nights)+' شب · '+fa.format(result.guests)+' نفر</p>'
        +'<p>ورود '+esc(dateLabel(result.checkIn))+' ساعت ۱۴:۰۰ — خروج '+esc(dateLabel(result.checkOut))+' ساعت ۱۲:۰۰</p>'
        +'<p>نام مهمان: '+esc(result.name)+'</p>'
        +'<strong>'+fa.format(result.total)+' تومان</strong>'
        +'<small>وضعیت: '+esc(result.status)+'</small></div>';
    }
    function lookup(code){
      const found=findReservation(code);
      if(!found){ slot.innerHTML=""; feedback.innerHTML='<p class="form-status form-status--error" role="alert">رزروی با این کد یافت نشد.</p>'; return; }
      feedback.innerHTML=""; showResult(found);
    }
    if(initialCode) lookup(initialCode);
    form.addEventListener("submit",(ev)=>{
      ev.preventDefault();
      const found=findReservation(input.value);
      if(!found){ slot.innerHTML=""; feedback.innerHTML='<p class="form-status form-status--error" role="alert">کد رهگیری معتبر نیست یا رزروی یافت نشد.</p>'; return; }
      feedback.innerHTML=""; showResult(found);
    });
  },{labelledBy:headingId});
}

/* ================= reveal motion ================= */
function initReveal(){
  const sections=document.querySelectorAll(".reveal-section");
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    sections.forEach((s)=>s.classList.add("has-entered")); return;
  }
  const observer=new IntersectionObserver((entries)=>{
    for(const entry of entries){
      if(!entry.isIntersecting) continue;
      entry.target.classList.add("has-entered");
      observer.unobserve(entry.target);
    }
  },{threshold:0.05,rootMargin:"0px 0px -30px 0px"});
  sections.forEach((s)=>observer.observe(s));
}

/* ================= init ================= */
(function init(){
  const header=renderHeader();
  const main=document.createElement("main");
  main.id="main-content"; main.tabIndex=-1;
  main.append(
    renderHero(),
    renderWelcome(),
    renderRooms(),
    renderDirect(),
    renderDining(),
    renderEvents(),
    renderAmenities(),
    renderGallery(),
    renderTestimonials(),
    renderOffers(),
    renderContact()
  );
  app.append(header,main,renderFooter(),renderFloatBar());
  initReveal();
})();
</script>
